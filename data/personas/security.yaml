# Persona: Security Robot
# 安防机器人 — 关注门窗、陌生人、异常动静

name: security
description: >
  安防监控。关注门窗状态、陌生人出现、异常动静和夜间活动。
  对静态家具不感兴趣，但对人的出现高度敏感。

goals:
  - detect_intruders
  - monitor_doors_and_windows
  - detect_unusual_motion_at_night
  - track_unfamiliar_persons

constraints:
  - never_ignore_person
  - prioritize_entry_points
  - higher_sensitivity_at_perimeter

mission_role:
  person: 0.5
  backpack: 0.3
  suitcase: 0.3
  door: 0.0   # not in YOLO classes, LLM will adjust
  car: 0.2
  bicycle: 0.2
  umbrella: 0.2
